<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Tokens Live Sandbox</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-canvas-primary);
      color: var(--text-primary);
      font-family: var(--subheading-md-fontfamily), system-ui, sans-serif;
      padding: 40px 24px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .toolbar {
      max-width: 1120px;
      margin: 0 auto 32px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .switcher { display: flex; gap: 8px; }
    .switcher button {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--card-border-color);
      background: var(--card-surface-bg);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
    }
    .switcher button.active {
      background: var(--button-bg-primary);
      color: var(--button-text-primary);
      border-color: var(--button-bg-primary);
    }
    .grid {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .hero, .card {
      background: var(--card-surface-bg);
      border: var(--card-border-width) solid var(--card-border-color);
      border-radius: var(--card-radius);
      padding: 40px;
    }
    .badge {
      display: inline-block;
      background: var(--badge-promo-bg);
      color: var(--badge-promo-text);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 20px;
    }
    h1 {
      font-family: var(--heading-lg-fontfamily), sans-serif;
      font-weight: 800;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.05;
      margin-bottom: var(--spacing-text-gap);
    }
    p {
      color: var(--text-secondary);
      font-size: 20px;
      line-height: 1.4;
      max-width: 640px;
      margin-bottom: var(--spacing-cta-gap);
    }
    .cta {
      display: inline-block;
      background: var(--button-bg-primary);
      color: var(--button-text-primary);
      padding: var(--button-md-padding-y) var(--button-md-padding-x);
      border-radius: var(--button-radius);
      font-family: var(--label-button-md-fontfamily), sans-serif;
      font-weight: 700;
      font-size: var(--label-button-md-fontsize);
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>Design Tokens Live Preview</strong>
    <div class="switcher">
      <button class="active" onclick="setTheme('light', this)">Light</button>
      <button onclick="setTheme('dark', this)">Dark</button>
      <button onclick="setTheme('campaign', this)">Campaign</button>
    </div>
  </div>

  <div class="grid">
    <section class="hero">
      <span class="badge">-20% OFF</span>
      <h1>MULTI-THEME DESIGN SYSTEM</h1>
      <p>Этот блок в реальном времени управляется CSS-переменными, сгенерированными из вашего tokens.json.</p>
      <button class="cta">BUY NOW</button>
    </section>
  </div>

  <script>
    function setTheme(theme, btn) {
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
